<body>
<div id="loading" class="loading" role="status" aria-live="polite">
  <div class="loading-box">
    <img class="loading-logo" src="./favicon.svg" alt="" width="72" height="72" />
    <p class="loading-brand">QUADRA</p>
    <p class="loading-title">Quadra Fixtures</p>
    <div id="loading-spinner" class="spinner" aria-hidden="true"></div>
    <div id="loading-error" class="loading-error" hidden>
      <p id="loading-error-text"></p>
      <button id="loading-reload" class="q-btn" type="button">重新整理 · Reload</button>
    </div>
  </div>
</div>
<script>
  (function () {
    var zh = /^zh/i.test(navigator.language || '');
    function $(id) { return document.getElementById(id); }
    window.__fxFail = function (message) {
      if ($('loading').hidden) return;
      $('loading-error-text').textContent = message || (zh ? '頁面沒有正常啟動，可能是網路不穩。' : "The page didn't start, maybe a network hiccup.");
      $('loading-error').hidden = false;
      $('loading-spinner').hidden = true;
    };
    $('loading-reload').onclick = function () { location.reload(); };
    window.addEventListener('error', function () { if (!window.__fxStarted) window.__fxFail(); });
    setTimeout(function () { if (!window.__fxStarted) window.__fxFail(); }, 15000);
  })();
</script>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <img class="brand-logo" src="./favicon.svg" alt="" width="34" height="34" />
      <div class="brand-text">
        <h1>Quadra Fixtures</h1>
        <p id="status" class="status" aria-live="polite"></p>
      </div>
    </div>
    <nav id="tabs" class="tabs q-tabbar" role="tablist">
      <button id="tab-home" class="tab q-tab" role="tab" type="button" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span></span></button>
      <button id="tab-scores" class="tab q-tab" role="tab" type="button" data-tab="scores"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span></span></button>
      <button id="tab-following" class="tab q-tab" role="tab" type="button" data-tab="following"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span></span></button>
      <button id="tab-standings" class="tab q-tab" role="tab" type="button" data-tab="standings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span></span></button>
    </nav>
    <a id="help-link" class="help-link" href="#" aria-label="說明">?</a>
    <div id="account-slot" class="account-slot"></div>
  </div>
</header>
<main class="page">
  <div id="mobile-bar" class="mobile-bar">
    <div id="brand-mini" class="brand-mini"><img src="./favicon.svg" alt="" width="30" height="30" /><div><strong>Fixtures</strong><span id="status-mini" class="status"></span></div></div>
  </div>
  <div id="panel-home" class="tab-panel" role="tabpanel"></div>
  <div id="panel-scores" class="tab-panel" role="tabpanel" hidden></div>
  <div id="panel-following" class="tab-panel" role="tabpanel" hidden></div>
  <div id="panel-standings" class="tab-panel" role="tabpanel" hidden></div>
</main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="./app.js" onerror="window.__fxFail()"></script>
</body>
